name: ProGo CI

on:
  push:
    branches: [ main, develop, "feature/**" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repository hygiene and build
        shell: powershell
        run: |
          try {
            .\scripts\Test-ProGo.ps1 *>&1 | Tee-Object -FilePath ci-output.txt
          } catch {
            $_ | Out-String | Tee-Object -FilePath ci-output.txt -Append
            throw
          }

      - name: Pack release zip
        if: success()
        shell: powershell
        run: |
          if (Test-Path ProGo-release.zip) { Remove-Item ProGo-release.zip -Force }
          Compress-Archive -Path .\release\* -DestinationPath .\ProGo-release.zip -Force
          Get-Item .\ProGo-release.zip | Format-List FullName,Length

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ProGo-ci-diagnostics
          path: ci-output.txt

      - name: Upload release folder
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ProGo-release
          path: release/

      - name: Upload release package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ProGo-release-zip
          path: ProGo-release.zip
