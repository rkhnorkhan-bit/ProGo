name: ProGo CI

on:
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: 'Explicitly approve uploading CI files (public for a public repository)'
        required: false
        type: boolean
        default: false
  push:
    branches: [ main, develop, "feature/**" ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  actions: write

concurrency:
  group: progo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vpn-server-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      tested_sha: ${{ steps.identity.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Record exact tested commit
        id: identity
        run: |
          tested_sha=$(git rev-parse HEAD)
          test "$tested_sha" = "$GITHUB_SHA"
          echo "sha=$tested_sha" >> "$GITHUB_OUTPUT"
      - name: Verify strict aggregate refusals
        run: python3 -m unittest discover -s tests -p 'test_ci_aggregate.py' -v
      - name: Verify private operation recovery
        # The isolated fixture exercises the real root-only owner entry point.
        # Its server effects are replaced; only temporary receipt files are written.
        run: sudo python3 -m unittest discover -s tests -p 'test_home_vpn_operations.py' -v
      - name: Decode QR independently and verify share endpoints
        run: |
          python3 -m venv /tmp/progo-qr-test
          /tmp/progo-qr-test/bin/pip install numpy==2.2.6 zxing-cpp==2.3.0
          /tmp/progo-qr-test/bin/python -m unittest discover -s tests -p 'test_profile_share*.py' -v
      - name: Provision isolated VPN and test invitation restrictions
        run: sudo --preserve-env=GITHUB_ACTIONS python3 tests/home_vpn_provision_smoke.py

  windows-build:
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      tested_sha: ${{ steps.identity.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record exact tested commit
        id: identity
        shell: powershell
        run: |
          $tested = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $tested -cne $env:GITHUB_SHA) { throw 'Tested checkout identity mismatch' }
          "sha=$tested" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Repository hygiene and Core build/tests
        shell: powershell
        run: |
          try {
            .\scripts\Test-ProGo.ps1 -Suite Core *>&1 | Tee-Object -FilePath ci-output.txt
          } catch {
            $_ | Out-String | Tee-Object -FilePath ci-output.txt -Append
            throw
          }

      - name: Set up Python for relay tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: IKEv2 relay integration tests on .NET Framework
        shell: powershell
        run: |
          .\scripts\Test-HomeVpnRelay.ps1

      - name: Check public sources and release content
        shell: powershell
        run: |
          python .\scripts\check_public_content.py --release .\release
          if ($LASTEXITCODE -ne 0) { throw 'Public content check failed' }

      # Public candidates need a separately approved delivery method. Build,
      # tests, content checks and packaging still run without uploading files.
      - name: Upload wizard screenshots
        if: always() && (github.event.repository.private || (github.event_name == 'workflow_dispatch' && inputs.upload_artifacts))
        uses: actions/upload-artifact@v4
        with:
          name: ProGo-wizard-screenshots
          path: |
            build/vpn-fixture/*.png
            build/desktop-shots/*.png
          retention-days: 3

      - name: Pack release zip
        if: success()
        shell: powershell
        run: |
          if (Test-Path ProGo-release.zip) { Remove-Item ProGo-release.zip -Force }
          Compress-Archive -Path .\release\* -DestinationPath .\ProGo-release.zip -Force
          Get-Item .\ProGo-release.zip | Format-List FullName,Length
          $candidateDigest = (Get-FileHash -LiteralPath .\ProGo-release.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host ("Candidate ZIP SHA256: " + $candidateDigest)

      - name: Upload diagnostics
        if: always() && (github.event.repository.private || (github.event_name == 'workflow_dispatch' && inputs.upload_artifacts))
        uses: actions/upload-artifact@v4
        with:
          name: ProGo-ci-diagnostics
          path: ci-output.txt
          retention-days: 7

      - name: Upload release folder
        if: success() && (github.event.repository.private || (github.event_name == 'workflow_dispatch' && inputs.upload_artifacts))
        uses: actions/upload-artifact@v4
        with:
          name: ProGo-release
          path: release/
          retention-days: 3

      - name: Upload release package
        if: success() && (github.event.repository.private || (github.event_name == 'workflow_dispatch' && inputs.upload_artifacts))
        uses: actions/upload-artifact@v4
        with:
          name: ProGo-release-zip
          path: ProGo-release.zip
          retention-days: 3

      - name: Prune old CI artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const names = new Set([
              'ProGo-ci-diagnostics',
              'ProGo-release',
              'ProGo-release-zip'
            ]);

            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              }
            );

            for (const name of names) {
              const matches = artifacts
                .filter(a => a.name === name && !a.expired)
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

              for (const artifact of matches.slice(1)) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id
                });
                core.info(`Deleted old artifact ${artifact.id} (${name}, ${artifact.created_at})`);
              }
            }

  installer-tests:
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      tested_sha: ${{ steps.identity.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Record exact tested commit
        id: identity
        shell: powershell
        run: |
          $tested = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $tested -cne $env:GITHUB_SHA) { throw 'Tested checkout identity mismatch' }
          "sha=$tested" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Repository hygiene, build and all Installer suites
        shell: powershell
        run: |
          .\scripts\Test-ProGo.ps1 -Suite Installer

  ci-complete:
    name: Exact-SHA complete CI gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [vpn-server-test, windows-build, installer-tests]
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v4
      - name: Require all partitions on exact tested commit
        env:
          PROGO_EXPECTED_SHA: ${{ github.sha }}
          PROGO_NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/check_ci_aggregate.py
