name: ProGo CI

on:
  push:
    branches: [ main, develop, "feature/**" ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  actions: write

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repository hygiene and build
        shell: powershell
        run: |
          try {
            .\scripts\Test-ProGo.ps1 *>&1 | Tee-Object -FilePath ci-output.txt
          } catch {
            $_ | Out-String | Tee-Object -FilePath ci-output.txt -Append
            throw
          }

      - name: Pack release zip
        if: success()
        shell: powershell
        run: |
          if (Test-Path ProGo-release.zip) { Remove-Item ProGo-release.zip -Force }
          Compress-Archive -Path .\release\* -DestinationPath .\ProGo-release.zip -Force
          Get-Item .\ProGo-release.zip | Format-List FullName,Length

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ProGo-ci-diagnostics
          path: ci-output.txt
          retention-days: 7

      - name: Upload release folder
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ProGo-release
          path: release/
          retention-days: 3

      - name: Upload release package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ProGo-release-zip
          path: ProGo-release.zip
          retention-days: 3

      - name: Prune old CI artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const names = new Set([
              'ProGo-ci-diagnostics',
              'ProGo-release',
              'ProGo-release-zip'
            ]);

            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              }
            );

            for (const name of names) {
              const matches = artifacts
                .filter(a => a.name === name && !a.expired)
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

              for (const artifact of matches.slice(1)) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id
                });
                core.info(`Deleted old artifact ${artifact.id} (${name}, ${artifact.created_at})`);
              }
            }
