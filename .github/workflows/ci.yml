name: ProGo CI

on:
  push:
    branches: [ main, develop, "feature/**" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repository hygiene and build
        shell: powershell
        run: |
          try {
            .\scripts\Test-ProGo.ps1 *>&1 | Tee-Object -FilePath ci-output.txt
          } catch {
            $_ | Out-String | Tee-Object -FilePath ci-output.txt -Append
            throw
          }

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ProGo-ci-diagnostics
          path: ci-output.txt

      - name: Upload release folder
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ProGo-release
          path: release/
