name: ProGo Release

on:
  push:
    branches: [ main ]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vpn-server-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Provision isolated VPN and test invitation restrictions
        run: sudo --preserve-env=GITHUB_ACTIONS python3 tests/home_vpn_provision_smoke.py

  publish-release:
    needs: vpn-server-test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test and build
        shell: powershell
        run: |
          .\scripts\Test-ProGo.ps1

      - name: Resolve version
        shell: powershell
        run: |
          $version = (Get-Content -Raw .\VERSION).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid VERSION: $version"
          }
          "PROGO_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PROGO_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $changelog = Get-Content -Raw -Encoding UTF8 .\CHANGELOG.md
          $section = '(?ms)^## ' + [regex]::Escape($version) + '[^\r\n]*\r?\n(.*?)(?=^## |\z)'
          if ($changelog -notmatch $section) { throw 'Changelog entry missing for release version' }
          Set-Content -Path .\build\release-notes.md -Value ($Matches[1].Trim()) -Encoding UTF8

      - name: Set up Python for release checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify relay and public package content
        shell: powershell
        run: |
          .\scripts\Test-HomeVpnRelay.ps1
          python .\scripts\check_public_content.py --release .\release
          if ($LASTEXITCODE -ne 0) { throw 'Public content check failed' }

      - name: Pack release
        shell: powershell
        run: |
          if (Test-Path .\ProGo-release.zip) {
            Remove-Item .\ProGo-release.zip -Force
          }
          Compress-Archive -Path .\release\* -DestinationPath .\ProGo-release.zip -Force
          Get-Item .\ProGo-release.zip | Format-List FullName,Length

      - name: Publish GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:PROGO_TAG
          $title = "ProGo $env:PROGO_VERSION"

          cmd /c "gh release view $tag --repo \"${{ github.repository }}\" >NUL 2>NUL"
          $releaseExists = ($LASTEXITCODE -eq 0)

          if ($releaseExists) {
            Write-Host "Release $tag already exists; replacing package asset."
            gh release upload $tag .\ProGo-release.zip --clobber --repo "${{ github.repository }}"
            if ($LASTEXITCODE -ne 0) { throw "Release asset upload failed." }
          } else {
            Write-Host "Creating release $tag."
            gh release create $tag .\ProGo-release.zip --target "${{ github.sha }}" --title $title --notes-file .\build\release-notes.md --repo "${{ github.repository }}"
            if ($LASTEXITCODE -ne 0) { throw "Release creation failed." }
          }

      - name: Verify release asset
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $json = gh release view $env:PROGO_TAG --repo "${{ github.repository }}" --json tagName,assets
          if ($LASTEXITCODE -ne 0) { throw "Cannot read published release." }
          $release = $json | ConvertFrom-Json
          if ($release.tagName -ne $env:PROGO_TAG) { throw "Published tag mismatch." }
          $asset = @($release.assets | Where-Object { $_.name -eq "ProGo-release.zip" })
          if ($asset.Count -ne 1) { throw "ProGo-release.zip is missing from release." }
          Write-Host "Release verified: $($release.tagName), asset=$($asset[0].name)"
